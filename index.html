<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="badge">API Connected</div>
      <h1>Tasks & Todos</h1>
      <p class="subtitle">Manage your daily work efficiently.</p>
    </header>

    <main class="app-body">
      <!-- Input Section -->
      <section class="card input-card">
        <h2>Add New Task</h2>
        <div class="form-group">
          <input type="text" id="title" placeholder="Task title..." autocomplete="off" />
          <input type="text" id="description" placeholder="Description or details..." autocomplete="off" />
          <button class="btn btn-primary" onclick="addTodo()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Task
          </button>
        </div>
      </section>

      <!-- Render Section -->
      <section class="todo-section">
        <ul class="render"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
